[project]
name = "tartandrive2-devkit"
version = "0.1.0"
description = "devkit for TartanDrive2"
readme = "README.md"
dependencies = [
    "numpy",
    "tqdm",
    "rosbags",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]